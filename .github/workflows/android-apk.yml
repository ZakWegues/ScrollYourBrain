name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  apk:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ScrollYourBrain.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollYourBrain-apk
          path: ScrollYourBrain.apk
          if-no-files-found: error
      # Every push publishes a release, so the "latest" download link always points to the newest build.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScrollYourBrain build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ScrollYourBrain.apk
          body: |
            Instale abrindo este link no celular:
            https://github.com/${{ github.repository }}/releases/latest/download/ScrollYourBrain.apk

            Commit: ${{ github.sha }}
