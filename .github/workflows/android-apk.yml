name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  apk:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_NO_TELEMETRY: 1
      # Used for the Android versionCode and shown in Ajustes, at prebuild and when the JS bundle is built.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # Optional release signing: with these secrets the APK/AAB are signed with your own key
      # (see docs/RELEASE.md); without them the build uses the Android debug key.
      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK (arm64)
        working-directory: android
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGN=()
          if [ "$SIGNED" = "true" ]; then
            SIGN=(-Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" -Pandroid.injected.signing.store.password="$KS_PASS" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASS")
          fi
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon "${SIGN[@]}"
      - name: Build store bundle (AAB, all architectures)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ScrollYourBrain.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollYourBrain-apk
          path: ScrollYourBrain.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.signed == 'true'
        with:
          name: ScrollYourBrain-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Pushes to main (or the repository's default branch) publish a release, so the "latest" download link always points to the newest build.
      - name: Release notes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_name == github.event.repository.default_branch)
        run: |
          {
            echo "Instale abrindo este link no celular:"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/ScrollYourBrain.apk"
            echo
            awk '/^## \[/{n++} n==1' CHANGELOG.md
            echo
            echo "Commit: ${{ github.sha }}"
          } > release-notes.md
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_name == github.event.repository.default_branch)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: ScrollYourBrain build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ScrollYourBrain.apk
          body_path: release-notes.md
