name: Erro de conteúdo
description: Resposta errada, explicação confusa ou vídeo fora do tema
labels: [conteúdo]
body:
  - type: input
    id: card
    attributes:
      label: Qual card?
      description: Conta e o começo da pergunta (ou o título do vídeo).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: O que está errado e qual seria o certo?
      description: Se puder, cite uma fonte (livro, site, prova).
    validations:
      required: true
